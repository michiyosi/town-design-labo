<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページが見つかりません | TOWN DESIGN LABO</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f4f4f3;
  --bg-deep: #ebebe9;
  --ink: #111111;
  --ink-mute: #6b6b6b;
  --line: #e5e5e3;
  --line-strong: #1a1a1a;
  --accent: #1a1a1a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--ink);
  font-family: "Inter","Noto Sans JP",-apple-system,sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
.wrap { max-width:520px; text-align:center; }
.mark { width:56px; height:56px; margin:0 auto 40px; display:block; }
.code { font-family:"Inter",monospace; font-size:11px; font-weight:500;
  letter-spacing:.25em; color:var(--ink-mute); text-transform:uppercase; margin-bottom:20px; }
h1 { font-family:"Cormorant Garamond",serif; font-weight:300; font-size:38px;
  line-height:1.35; letter-spacing:.02em; margin-bottom:24px; }
h1 em { font-style:italic; }
p { font-size:14px; line-height:1.95; color:var(--ink-mute); margin-bottom:36px; }
.btn { display:inline-block; border:1px solid var(--line-strong); padding:15px 30px;
  font-size:12px; font-weight:500; letter-spacing:.12em; color:var(--ink);
  text-decoration:none; transition:.2s; }
.btn:hover { background:var(--ink); color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="100" rx="22" fill="#111111"/><rect x="18" y="25" width="64" height="12" fill="#f5f5f4"/><rect x="44" y="25" width="12" height="60" fill="#f5f5f4"/><rect x="30" y="78" width="40" height="7" fill="#f5f5f4"/></svg>
  <div class="code">Error 404 / Not Found</div>
  <h1>この道の先には、<br><em>まだ何もありません</em>。</h1>
  <p>お探しのページは、移動または削除された可能性があります。<br>動く建築のことなら、トップページからご覧ください。</p>
  <a class="btn" href="/">トップページへ戻る &rarr;</a>
</div>
</body>
</html>
